name: Validate AmpybiOS foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON configuration
        run: python3 scripts/validate_config.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Performance policy tests (JDK)
        run: bash scripts/test_performance_policy.sh
      - name: Shell syntax
        run: bash -n scripts/*.sh
