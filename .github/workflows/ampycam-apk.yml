name: AmpyCam debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/AmpyCam/**'
      - 'config/themes/**'
      - 'scripts/build_ampycam_local.sh'
      - 'scripts/build_ampycore_local.sh'
      - '.github/workflows/ampycam-apk.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 37
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build AmpyCam
        run: bash scripts/build_ampycam_local.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: AmpyCam-debug-apk
          path: apps/AmpyCam/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
