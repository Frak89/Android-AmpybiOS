name: AmpyCore APK (standalone prototype)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/AmpyCore/**'
      - 'config/themes/**'
      - '.github/workflows/ampycore-apk.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 37
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Compile AmpyCore debug APK
        working-directory: apps/AmpyCore
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AmpyCore-debug-apk
          path: apps/AmpyCore/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
